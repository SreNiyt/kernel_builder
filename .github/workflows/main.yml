name: build
on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'Compiler to use'
        required: true
        default: 'Neutron-Clang'
      ROOT_METHOD:
        description: 'what did you want to add?'
        required: true
        default: 'ksu'
        type: choice
        options:
          - 'none'
          - 'ksu'
          - 'nomount'
      WIREGUARD:
        description: 'WireGuard?'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dnf group install development-tools -y
          dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz which git -y
          ln -sf "/usr/bin/python3" /usr/bin/python
          git config --global user.name "zclkkk"
          git config --global user.email "zclkkk@example.com"

      - name: Clone Kernel Source and Patch WireGuard
        run: |
          git clone --depth=1 --quiet https://github.com/SreNiyt/kernel kernel
          if [ "${{ github.event.inputs.WIREGUARD }}" = "yes" ]; then
            echo "WireGuard is enabled. Patching kernel tree..."
            ./wireguard-linux-compat/kernel-tree-scripts/create-patch.sh | patch -p1 -d kernel
            echo "CONFIG_WIREGUARD=y" >> kernel/arch/arm64/configs/blossom_defconfig
            echo "CONFIG_WIREGUARD_DEBUG=n" >> kernel/arch/arm64/configs/blossom_defconfig
          else
            echo "WireGuard is disabled. Skipping patches."
          fi

      - name: Apply Root Patches and Compile Kernel
        run: |
          cd kernel
          if [ "${{ github.event.inputs.ROOT_METHOD }}" = "ksu" ]; then
            echo "Applying standard KernelSU..."
            bash ../ksu/applyPatches.sh
          elif [ "${{ github.event.inputs.ROOT_METHOD }}" = "nomount" ]; then
            echo "Applying NoMount (4.19) standalone..."
            echo "Cloning NoMount 4.19 fork..."
            git clone --depth=1 https://github.com/SreNiyt/nomount ../nomount_src
            echo "Merging NoMount files..."
            cp -r ../nomount_src/kernel/fs/* fs/
            cp -r ../nomount_src/kernel/include/linux/* include/linux/
            echo "Applying NoMount kernel patch..."
            patch -p1 < ../nomount_src/kernel/patches/nomount_4.19_kernel_integration.patch
            echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/blossom_defconfig
          else
            echo "No root method selected. Building clean kernel."
          fi
          bash ../build.sh "${{ github.event.inputs.COMPILER }}"

      - name: Find config
        id: find_config
        run: |
          CONFIG=$(find . -name .config | head -n 1)
          echo "Found config: $CONFIG"
          echo "config_path=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Upload Flashable Zip and Config
        uses: actions/upload-artifact@v4
        with:
          name: Night
          path: |
            kernel/*.zip
            ${{ steps.find_config.outputs.config_path }}
          include-hidden-files: true
          retention-days: 5

