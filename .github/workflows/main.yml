name: Dandelion Headless Build

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'Compiler to use'
        required: true
        default: 'AOSP-Clang'
      KSU:
        description: 'Root: ksu (for KernelSU), both (KSU+SuSFS), or none'
        required: false
        default: 'none'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:40

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dnf group install development-tools -y
          dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz which git -y
          ln -sf "/usr/bin/python3" /usr/bin/python
          git config --global user.name "zclkkk"
          git config --global user.email "zclkkk@example.com"
          
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/zyexro/sashimi_kernel_xiaomi_blossom -b sashimi kernel
          
      - name: broken screen patch
        run: |
          cd kernel
          
          # Undervolt and add 2.3GHz OC step
          sed -i 's/opp-microvolt = <1118750>;/opp-microvolt = <1093750>;/g' arch/arm64/boot/dts/mediatek/mt6765.dts
          sed -i '/opp-2106000 {/,/};/ s/};/};\n\t\topp-2301000 {\n\t\t\topp-hz = \/bits\/ 64 <2301000000>;\n\t\t\topp-microvolt = <1125000>;\n\t\t};/' arch/arm64/boot/dts/mediatek/mt6765.dts
          sed -i 's/clock-frequency = <2106000000>;/clock-frequency = <2301000000>;/g' arch/arm64/boot/dts/mediatek/mt6765.dts
          
          # Set 300Hz tick rate and disable Gentle Fair Sleepers
          sed -i 's/CONFIG_HZ_100=y/CONFIG_HZ_300=y/' arch/arm64/configs/blossom_defconfig
          sed -i 's/CONFIG_HZ=100/CONFIG_HZ=300/' arch/arm64/configs/blossom_defconfig
          sed -i 's/SCHED_FEAT(GENTLE_FAIR_SLEEPERS, true)/SCHED_FEAT(GENTLE_FAIR_SLEEPERS, false)/' kernel/sched/features.h
          echo "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" >> arch/arm64/configs/blossom_defconfig

          # Disable DVFSP and tune freq scaling times
          sed -i 's/state = <1>;/state = <0>;/' arch/arm64/boot/dts/mediatek/mt6765.dts
          sed -i 's/big-rise-time = <1000>;/big-rise-time = <6000>;/' arch/arm64/boot/dts/mediatek/mt6765.dts
          sed -i 's/big-down-time = <750>;/big-down-time = <100>;/' arch/arm64/boot/dts/mediatek/mt6765.dts
          sed -i 's/up_rate_limit_us = <2000>;/up_rate_limit_us = <500>;/' arch/arm64/boot/dts/mediatek/mt6765.dts
          sed -i 's/down_rate_limit_us = <1000>;/down_rate_limit_us = <2000>;/' arch/arm64/boot/dts/mediatek/mt6765.dts

          # Enable BBR2, MTK HW Random, and Full Preemption
          echo "CONFIG_HW_RANDOM_MTK=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_TCP_CONG_BBR2=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr2\"" >> arch/arm64/configs/blossom_defconfig
          sed -i 's/CONFIG_PREEMPT_VOLUNTARY=y/CONFIG_PREEMPT=y/' arch/arm64/configs/blossom_defconfig
          echo "CONFIG_PREEMPT_COUNT=y" >> arch/arm64/configs/blossom_defconfig

          # Disable TEE, GZ, and Trustonic security
          sed -i 's/CONFIG_MTK_GZ=y/CONFIG_MTK_GZ=n/' arch/arm64/configs/blossom_defconfig
          sed -i 's/CONFIG_MICROTRUST_TEE_SUPPORT=y/CONFIG_MICROTRUST_TEE_SUPPORT=n/' arch/arm64/configs/blossom_defconfig
          sed -i 's/CONFIG_TRUSTONIC_TEE_SUPPORT=y/CONFIG_TRUSTONIC_TEE_SUPPORT=n/' arch/arm64/configs/blossom_defconfig

          # Link dummy uuid_fp object and fix serial console conflict
          echo 'int uuid_fp(void) { return 0; }' > kernel/uuid_dummy.c
          echo 'obj-y += uuid_dummy.o' >> kernel/Makefile
          sed -i 's/extern.*uuid_fp.*//g' drivers/misc/mediatek/video/common/win_minmax.c
          sed -i 's/if (uuid_fp())/if (0)/g' drivers/misc/mediatek/video/common/win_minmax.c
          sed -i 's/if (uuid_fp)/if (0)/g' drivers/misc/mediatek/video/common/win_minmax.c
          sed -i 's/CONFIG_SERIAL_8250_CONSOLE=y/# CONFIG_SERIAL_8250_CONSOLE is not set/' arch/arm64/configs/blossom_defconfig
          
          # Add extra governors
          echo "CONFIG_CPU_FREQ_GOV_POWERSAVE=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y" >> arch/arm64/configs/blossom_defconfig


      - name: Compile Kernel
        run: |
          cd kernel
          # We skip the tg_utils calls since you don't use Telegram
          if [ "${{ github.event.inputs.KSU }}" = "ksu" ] || [ "${{ github.event.inputs.KSU }}" = "both" ]; then
            bash ../ksu/applyPatches.sh
          fi
          bash ../build.sh "${{ github.event.inputs.COMPILER }}"

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-Dandelion-Headless
          path: kernel/*.zip
          retention-days: 5

