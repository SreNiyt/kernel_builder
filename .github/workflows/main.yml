name: Dandelion Headless Build

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'Compiler to use'
        required: true
        default: 'AOSP-Clang'
      KSU:
        description: 'Root: ksu (for KernelSU), both (KSU+SuSFS), or none'
        required: false
        default: 'ksu'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:40

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dnf group install development-tools -y
          dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz which git -y
          ln -sf "/usr/bin/python3" /usr/bin/python
          git config --global user.name "zclkkk"
          git config --global user.email "zclkkk@example.com"
          
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/zyexro/sashimi_kernel_xiaomi_blossom -b sashimi kernel

      - name: stable server patch
        run: |
          cd kernel
          
          # undervolt to -35mV
          sed -i 's/1118750/1083750/g' arch/arm64/boot/dts/mediatek/mt6765.dts
          
          # boost ram speed
          sed -i 's/peak-bw = <4000000>/peak-bw = <5500000>/g' arch/arm64/boot/dts/mediatek/mt6765.dts
          
          # gpu oc to 680mhz
          sed -i 's/opp-hz = <650000000>/opp-hz = <680000000>/g' arch/arm64/boot/dts/mediatek/mt6765.dts
          
          # tweak dirty ratio
          sed -i 's/define DEFAULT_DIRTY_RATIO.*/define DEFAULT_DIRTY_RATIO 10/g' include/linux/writeback.h

          # properly inject HZ and Scheduler tweaks
          # we run the defconfig first, then modify it before compilation
          make ARCH=arm64 blossom_defconfig
          scripts/config --file .config -e CONFIG_HZ_300
          scripts/config --file .config -d CONFIG_HZ_100
          scripts/config --file .config --set-val CONFIG_HZ 300
          scripts/config --file .config -d CONFIG_SCHED_AUTOGROUP
          scripts/config --file .config -d CONFIG_GENTLE_FAIR_SLEEPERS
          
      - name: Compile Kernel
        run: |
          cd kernel
          # We skip the tg_utils calls since you don't use Telegram
          if [ "${{ github.event.inputs.KSU }}" = "ksu" ] || [ "${{ github.event.inputs.KSU }}" = "both" ]; then
            bash ../ksu/applyPatches.sh
          fi
          bash ../build.sh "${{ github.event.inputs.COMPILER }}"

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-Dandelion-Headless
          path: kernel/*.zip
          retention-days: 5
