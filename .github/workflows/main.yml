name: Dandelion Headless Build

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'Compiler to use'
        required: true
        default: 'AOSP-Clang'
      KSU:
        description: 'Root: ksu (for KernelSU), both (KSU+SuSFS), or none'
        required: false
        default: 'none'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:40

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dnf group install development-tools -y
          dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz which git -y
          ln -sf "/usr/bin/python3" /usr/bin/python
          git config --global user.name "zclkkk"
          git config --global user.email "zclkkk@example.com"
          
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/zyexro/sashimi_kernel_xiaomi_blossom -b sashimi kernel

      - name: broken screen patch
        run: |
          cd kernel
          
          # Smart config function
          set_config() {
            if grep -q "$1" arch/arm64/configs/blossom_defconfig; then
              sed -i "s/.*$1.*/$1=y/" arch/arm64/configs/blossom_defconfig
            else
              echo "$1=y" >> arch/arm64/configs/blossom_defconfig
            fi
          }

          # 1. CORE PERFORMANCE (300Hz + Preemption)
          set_config "CONFIG_HZ_300"
          set_config "CONFIG_PREEMPT"
          set_config "CONFIG_PREEMPT_COUNT"
          
          # 2. NETWORKING & BBR2
          set_config "CONFIG_TCP_CONG_BBR2"
          set_config "CONFIG_DEFAULT_TCP_CONG=\"bbr2\""
          set_config "CONFIG_NET_SCH_FQ"
          set_config "CONFIG_HW_RANDOM_MTK"

          # 3. NATIVE MEDIATEK OPTIMIZATIONS
          # Enables specific MTK hardware acceleration for internal data tasks
          set_config "CONFIG_MTK_COMBO_CHIP"
          set_config "CONFIG_MTK_PLAT_ION"
          set_config "CONFIG_MTK_SCHED_TRACER"

          # 4. MEMORY MANAGEMENT (Essential for 2GB/3GB RAM)
          # Helps merge duplicate memory pages to free up space
          set_config "CONFIG_KSM"
          set_config "CONFIG_KSM_LEGACY"
          
          # 5. SOURCE FIXES (Undervolt + Compilation)
          # Stable Undervolt
          sed -i 's/opp-microvolt = <1118750>;/opp-microvolt = <1093750>;/g' arch/arm64/boot/dts/mediatek/mt6765.dts
          
          
      - name: Compile Kernel
        run: |
          cd kernel
          # We skip the tg_utils calls since you don't use Telegram
          if [ "${{ github.event.inputs.KSU }}" = "ksu" ] || [ "${{ github.event.inputs.KSU }}" = "both" ]; then
            bash ../ksu/applyPatches.sh
          fi
          bash ../build.sh "${{ github.event.inputs.COMPILER }}"

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Sashimi-Dandelion-Headless
          path: kernel/*.zip
          retention-days: 5

